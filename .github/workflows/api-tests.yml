name: ReqRes API Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
      - 'feature/*'
      - 'fix/*'
    paths:
      - 'apis/**'
      - 'environments/**'
      - '.github/workflows/**'
  pull_request:
    branches:
      - main
      - develop

permissions:
  checks: write
  contents: read

jobs:
  validate:
    name: Validate OpenAPI Spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Redocly CLI
        run: npm install -g @redocly/cli

      - name: Lint OpenAPI spec
        run: redocly lint apis/openapi.yaml --format=stylish

  test:
    name: Run API Tests
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install apidog-cli
        run: npm install -g apidog-cli

      - name: Run API tests
        run: |
          apidog run \
            --access-token "${{ secrets.APIDOG_ACCESS_TOKEN }}" \
            --project-id "${{ secrets.APIDOG_PROJECT_ID }}" \
            --bail \
            --verbose

      - name: Publish JUnit test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: ReqRes API Tests
          path: reports/junit-*.xml
          reporter: java-junit
          fail-on-error: false
