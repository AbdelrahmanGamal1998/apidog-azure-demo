name: ReqRes API Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
      - 'feature/*'
      - 'fix/*'
    paths:
      - 'apis/**'
      - 'environments/**'
      - '.github/workflows/**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  validate:
    name: Validate OpenAPI Spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Redocly CLI
        run: npm install -g @redocly/cli

      - name: Lint OpenAPI spec
        run: redocly lint apis/openapi.yaml --format=stylish

  test:
    name: Run API Tests
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Newman
        run: npm install -g newman newman-reporter-htmlextra

      - name: Create reports directory
        run: mkdir -p reports

      - name: Run API tests
        run: |
          newman run apis/collection.json \
            -e environments/production.json \
            --env-var "apiKey=${{ secrets.REQRES_API_KEY }}" \
            --reporters cli,htmlextra,junit \
            --reporter-htmlextra-export "reports/report-${{ github.run_id }}.html" \
            --reporter-junit-export "reports/junit-${{ github.run_id }}.xml" \
            --bail

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports
          path: reports/

      - name: Publish JUnit test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: ReqRes API Tests
          path: reports/junit-*.xml
          reporter: java-junit
          fail-on-error: false
