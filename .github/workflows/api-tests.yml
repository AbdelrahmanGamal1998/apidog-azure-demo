name: ReqRes API Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
      - 'feature/*'
      - 'fix/*'
    paths:
      - 'apis/**'
      - 'environments/**'
      - '.github/workflows/**'
  pull_request:
    branches:
      - main
      - develop

permissions:
  checks: write
  contents: read

jobs:
  validate:
    name: Validate OpenAPI Spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Redocly CLI
        run: npm install -g @redocly/cli

      - name: Lint OpenAPI spec
        run: redocly lint apis/openapi.yaml --format=stylish

  test:
    name: Run API Tests
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install apidog-cli
        run: npm install -g apidog-cli@2.8.31

      - name: Verify apidog-cli version
        run: apidog --version

      - name: Create reports directory
        run: mkdir -p reports

      - name: Inject REQRES_API_KEY into environment file
        run: sed -i 's/YOUR_REQRES_API_KEY/${{ secrets.REQRES_API_KEY }}/g' environments/production.json

      - name: Run API tests
        run: |
          apidog run apis/collection.json \
            --environment-file environments/production.json \
            --reporter-html-export "reports/report-${{ github.run_id }}.html" \
            --bail \
            --verbose

      - name: Generate JUnit XML report
        if: always()
        run: |
          apidog run apis/collection.json \
            --environment-file environments/production.json \
            --report-type junit \
            --report-file "reports/junit-${{ github.run_id }}.xml" \
            --verbose 2>/dev/null || true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports
          path: reports/

      - name: Publish JUnit test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: ReqRes API Tests
          path: reports/junit-*.xml
          reporter: java-junit
          fail-on-error: false
