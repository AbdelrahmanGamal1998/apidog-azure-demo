openapi: 3.0.3
info:
  title: ReqRes API Automation
  description: API automation suite for reqres.in — login and users endpoints
  version: 1.0.0
  contact:
    email: abdelrahmangamal.h@gmail.com

servers:
  - url: https://reqres.in/api
    description: ReqRes public API

tags:
  - name: Auth
    description: Authentication endpoints
  - name: Users
    description: User management endpoints

paths:
  /login:
    post:
      tags: [Auth]
      summary: Login user
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              valid_user:
                summary: Valid credentials
                value:
                  email: eve.holt@reqres.in
                  password: cityslicka
              invalid_user:
                summary: Missing password
                value:
                  email: peter@klaven
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Bad request — missing credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users:
    get:
      tags: [Users]
      summary: List users (paginated)
      operationId: listUsers
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
          description: Page number
        - name: per_page
          in: query
          schema:
            type: integer
            default: 6
          description: Items per page
      responses:
        '200':
          description: Paginated list of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersListResponse'

    post:
      tags: [Users]
      summary: Create user
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
            examples:
              new_user:
                summary: New engineer
                value:
                  name: Abdelrahman Gamal
                  job: QA Engineer
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateUserResponse'

  /users/{id}:
    get:
      tags: [Users]
      summary: Get single user
      operationId: getUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 2
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleUserResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                type: object

    put:
      tags: [Users]
      summary: Update user (full)
      operationId: updateUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateUserResponse'

    patch:
      tags: [Users]
      summary: Update user (partial)
      operationId: patchUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: User patched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateUserResponse'

    delete:
      tags: [Users]
      summary: Delete user
      operationId: deleteUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 2
      responses:
        '204':
          description: User deleted (no content)

components:
  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    LoginResponse:
      type: object
      properties:
        token:
          type: string
          example: QpwL5tpe83ilfN2

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: Missing password

    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        avatar:
          type: string
          format: uri

    UsersListResponse:
      type: object
      properties:
        page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer
        data:
          type: array
          items:
            $ref: '#/components/schemas/User'
        support:
          $ref: '#/components/schemas/Support'

    SingleUserResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/User'
        support:
          $ref: '#/components/schemas/Support'

    CreateUserRequest:
      type: object
      required: [name, job]
      properties:
        name:
          type: string
        job:
          type: string

    CreateUserResponse:
      type: object
      properties:
        name:
          type: string
        job:
          type: string
        id:
          type: string
        createdAt:
          type: string
          format: date-time

    UpdateUserRequest:
      type: object
      properties:
        name:
          type: string
        job:
          type: string

    UpdateUserResponse:
      type: object
      properties:
        name:
          type: string
        job:
          type: string
        updatedAt:
          type: string
          format: date-time

    Support:
      type: object
      properties:
        url:
          type: string
        text:
          type: string

  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: Free key from https://app.reqres.in/api-keys
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - apiKeyAuth: []
